# cargo-audit configuration

[advisories]
ignore = [
    "RUSTSEC-2024-0436", # paste is unmaintained (transitive dep of faer/gemm)
    "RUSTSEC-2026-0192", # ttf-parser is unmaintained (transitive dep of egui)
    "RUSTSEC-2026-0194", # quick-xml quadratic duplicate attribute checks
    "RUSTSEC-2026-0195", # quick-xml NsReader unbounded namespace allocation (not used; plain Reader used)
    "RUSTSEC-2026-0367", # zip extraction suid/sgid
    "RUSTSEC-2026-0368", # zip extraction symlinks
    "RUSTSEC-2026-0369", # zip permissions through symlinks
]
