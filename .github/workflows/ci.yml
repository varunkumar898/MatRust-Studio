name: CI

on:
  push:
    branches: [ main, master, ci-setup, hardening, wip/** ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cargo Format Check
        run: cargo fmt --all -- --check

      - name: Install cbindgen
        uses: taiki-e/install-action@v2
        with:
          tool: cbindgen@0.29.0

      - name: C FFI header is cbindgen-generated and committed
        run: |
          cbindgen --config cbindgen.toml --crate mlapp-ffi --output crates/mlapp-ffi/include/mlapp.h
          git diff --exit-code -- crates/mlapp-ffi/include/mlapp.h

  test-matrix:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies for GUI / egui
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (--all-targets --all-features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Clippy (--all-targets --no-default-features)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: Cargo Test (default features)
        run: |
          mkdir -p target/test-logs
          cargo test --workspace -- --nocapture | tee target/test-logs/test-default-${{ matrix.os }}.log
        shell: bash

      - name: Cargo Test (--all-features)
        run: cargo test --workspace --all-features

      - name: Cargo Test (--no-default-features)
        run: cargo test --workspace --no-default-features

      - name: Check Workspace Benchmarks
        run: cargo bench --workspace --no-run

      - name: Cargo Doc (no broken links / warnings)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Test Count Guard (anti-regression check)
        run: |
          ACTIVE_COUNT=$(cargo test --workspace -- --list | grep -E ': test$' | wc -l)
          echo "Active workspace test count: $ACTIVE_COUNT"
          MANIFEST_COUNT=$(grep -E ': test$' docs/test-manifest.txt | wc -l)
          echo "Manifest baseline test count: $MANIFEST_COUNT"
          if [ "$ACTIVE_COUNT" -ne "$MANIFEST_COUNT" ]; then
            echo "ERROR: Test manifest does not match the real total ($ACTIVE_COUNT active vs $MANIFEST_COUNT manifest)!"
            echo "Add/remove the test from docs/test-manifest.txt with a written reason in the same commit."
            exit 1
          fi
        shell: bash

      - name: Upload Test Logs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: target/test-logs/

  fuzz:
    name: Cargo Fuzz Targets (Smoke & Nightly Runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Run Corpus Smoke Test Suite
        run: cargo test --manifest-path fuzz/Cargo.toml --test corpus_smoke
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Run Fuzz Targets (60s per target)
        run: |
          cargo +nightly fuzz run fuzz_parser --target x86_64-unknown-linux-gnu -- -max_total_time=60
          cargo +nightly fuzz run fuzz_xml --target x86_64-unknown-linux-gnu -- -max_total_time=60
          cargo +nightly fuzz run fuzz_zip --target x86_64-unknown-linux-gnu -- -max_total_time=60

  security:
    name: Security & License Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo-deny (licenses, bans, advisories)
        run: cargo deny check licenses bans advisories

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo-audit
        run: cargo audit

  msrv:
    name: MSRV Check (Rust 1.88.0)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Print toolchain versions and check workspace under MSRV
        run: |
          rustc --version
          cargo --version
          cargo check --workspace --all-targets --all-features --locked

  geiger:
    name: Unsafe Code Audit (cargo-geiger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-geiger
        run: cargo install cargo-geiger --locked
      - name: Generate Geiger Report
        run: |
          mkdir -p target/geiger
          cargo geiger --all-features > target/geiger/geiger-report.txt || true
      - name: Upload Geiger Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: geiger-report
          path: target/geiger/geiger-report.txt
