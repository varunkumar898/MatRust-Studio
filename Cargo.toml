[workspace]
resolver = "2"
members = [
    "crates/rustlab-parse",
    "crates/rustlab-math",
    "crates/rustlab-eval",
    "crates/rustlab-stdlib",
    "crates/rustlab-matio",
    "crates/rustlab-data",
    "crates/rustlab-cli",
]

[profile.release]
# Standalone numerical engine binary uses panic = "abort" to eliminate
# landing pad tables and EH frames, optimizing binary size and vector registers.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Benchmarks inherit optimized release codegen settings.
[profile.bench]
inherits = "release"


