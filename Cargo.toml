[workspace]
resolver = "2"
members = [
    "crates/rustlab-parse",
    "crates/rustlab-math",
    "crates/rustlab-eval",
    "crates/rustlab-stdlib",
    "crates/rustlab-matio",
    "crates/rustlab-data",
    "crates/rustlab-cli",
    "crates/mlapp-container",
    "crates/mlapp-cli",
    "crates/mlapp-ui",
    "crates/mlapp-lang",
    "crates/mlapp-runtime",
    "crates/mlapp-plot",
    "crates/mlapp-host",
    "crates/mlapp-render",
    "crates/mlapp-ffi",
    "crates/mlapp-matlab",
    "crates/mlapp-sim",
    "apps/desktop",
]

[workspace.package]
# MSRV is 1.88.0: the locked dependency graph contains crates that declare
# rust-version = 1.88.0 (for example zip 9.2.0, proptest 1.12.0, image 0.25.10).
# Rust 1.80.0 cannot even parse edition2024 manifests; see the CI evidence in
# docs/verify-logs/2026-11-01-c19db918d8a293c8a2c8bc56147a3c7ac03c10a4-msrv-1.80-github-job-124807996217.log.
rust-version = "1.88.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
# Standalone numerical engine binary uses panic = "unwind" to eliminate
# landing pad tables and EH frames, optimizing binary size and vector registers.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"

# Benchmarks inherit optimized release codegen settings.
[profile.bench]
inherits = "release"
lto = "thin"
codegen-units = 16
