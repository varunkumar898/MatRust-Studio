[workspace]
resolver = "2"
members = [
    "crates/rustlab-parse",
    "crates/rustlab-math",
    "crates/rustlab-eval",
    "crates/rustlab-stdlib",
    "crates/rustlab-matio",
    "crates/rustlab-cli",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Benchmarks must run under the *same* codegen as the shipped binary. The bench
# profile does not inherit user [profile.release] overrides automatically, so it
# is pinned explicitly; panic stays unwind because criterion's sampling loop
# requires unwinding.
[profile.bench]
inherits = "release"
panic = "unwind"

