name: Bug report
description: Report a reproducible defect in MatRust Studio
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "Please do not attach proprietary MATLAB files or private data. A small, self-authored example is best."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "e.g. v0.1.0-alpha or commit SHA"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and Rust version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a minimal script or command that you wrote yourself.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized output
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Remove usernames, local paths, credentials, and private files before posting.
