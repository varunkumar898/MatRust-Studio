name: Feature request
description: Suggest a focused improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: cleanroom
    attributes:
      label: Compatibility and clean-room check
      options:
        - label: I have not included proprietary files, GPL implementation code, or private data.
          required: true
