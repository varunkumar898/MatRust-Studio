name: Compatibility report
description: Report an unsupported or partially supported MATLAB-style function or app feature.
title: "[Compatibility]: "
labels: ["compatibility"]
body:
  - type: input
    id: function
    attributes:
      label: Function, syntax, or app feature
      placeholder: "e.g. ode45, table indexing, callback behavior"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MatRust Studio commit or release
    validations:
      required: true
  - type: textarea
    id: script
    attributes:
      label: Minimal synthetic example
      description: Do not include proprietary files or customer code.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result and source
      description: Link public documentation or give an analytical expected value. Do not paste copyrighted text.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and clean-room confirmation
      options:
        - label: This report contains no real proprietary `.mlapp`/`.slx`, private data, or copied implementation code.
          required: true
