[package]
name = "matrust_studio"
version = "0.1.0"
edition = "2021"
description = "MATSTUDIO / MatRust Studio: MATLAB-compatible scientific computing desktop IDE in Rust"
license = "MIT OR Apache-2.0"

[lib]
name = "matrust_studio"
path = "src/lib.rs"

[[bin]]
name = "matrust_studio"
path = "src/main.rs"

[dependencies]
rustlab-parse = { path = "../../crates/rustlab-parse" }
rustlab-math = { path = "../../crates/rustlab-math" }
rustlab-eval = { path = "../../crates/rustlab-eval" }
rustlab-stdlib = { path = "../../crates/rustlab-stdlib", default-features = false }
rustlab-cli = { path = "../../crates/rustlab-cli" }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mlapp-sim = { path = "../../crates/mlapp-sim" }
png = "0.18"
# Native folder picker for Current Folder. MIT; no helper processes are launched;
# the Windows backend uses the system IFileDialog and is only opened on click.
rfd = { version = "0.18.0", default-features = false, features = ["common-controls-v6", "xdg-portal"] }

[features]
default = ["faer", "data"]
faer = ["rustlab-stdlib/faer"]
data = ["rustlab-stdlib/data"]
