[package]
name = "mlapp-backend"
version = "0.1.0"
edition = "2021"
authors = ["mlapp-rs contributors"]
license = "MIT OR Apache-2.0"
description = "External backend trait, persistent worker, framed IPC, and mock backend for Octave/Julia bridges"

[dependencies]
rustlab-math = { path = "../rustlab-math" }
rustlab-matio = { path = "../rustlab-matio" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"
