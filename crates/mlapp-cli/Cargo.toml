[package]
name = "mlapp-cli"
version = "0.1.0"
edition = "2021"
authors = ["mlapp-rs contributors"]
license = "MIT OR Apache-2.0"
description = "CLI inspection, extraction, compatibility checking, and execution tools for mlapp-rs"

[dependencies]
mlapp-container = { path = "../mlapp-container" }
mlapp-lang = { path = "../mlapp-lang" }
mlapp-host = { path = "../mlapp-host" }
mlapp-ui = { path = "../mlapp-ui" }
mlapp-render = { path = "../mlapp-render" }
mlapp-sim = { path = "../mlapp-sim" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
