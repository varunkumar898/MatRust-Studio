[package]
name = "mlapp-host"
version = "0.1.0"
edition = "2021"
authors = ["mlapp-rs contributors"]
license = "MIT OR Apache-2.0"
description = "App lifecycle, threaded worker execution, event loop, and callback dispatch for MATLAB App Designer"

[dependencies]
mlapp-container = { path = "../mlapp-container" }
mlapp-ui = { path = "../mlapp-ui" }
mlapp-lang = { path = "../mlapp-lang" }
mlapp-runtime = { path = "../mlapp-runtime" }
mlapp-plot = { path = "../mlapp-plot" }
rustlab-math = { path = "../rustlab-math" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
zip = { version = "2.2", default-features = false, features = ["deflate"] }
