[package]
name = "mlapp-lang"
version = "0.1.0"
edition = "2021"
authors = ["mlapp-rs contributors"]
license = "MIT OR Apache-2.0"
description = "MATLAB App Designer language frontend, classdef AST, callback/property extraction, and static compatibility analyzer"

[dependencies]
rustlab-parse = { path = "../rustlab-parse" }
quick-xml = { version = "0.37" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
insta = { version = "1.41", features = ["yaml"] }
