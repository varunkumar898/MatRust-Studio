[package]
name = "mlapp-octave"
version = "0.1.0"
edition = "2021"
authors = ["mlapp-rs contributors"]
license = "MIT OR Apache-2.0"
description = "Clean-room GNU Octave subprocess bridge for automated conformance and runtime fallback"

[features]
default = ["octave-bridge"]
octave-bridge = []

[dependencies]
rustlab-math = { path = "../rustlab-math" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"
