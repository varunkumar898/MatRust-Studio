[package]
name = "mlapp-render"
version = "0.1.0"
edition = "2021"
authors = ["mlapp-rs contributors"]
license = "MIT OR Apache-2.0"
description = "Pluggable UI rendering abstraction, egui renderer backend, and headless mock renderer for MATLAB App Designer"

[dependencies]
mlapp-ui = { path = "../mlapp-ui" }
mlapp-host = { path = "../mlapp-host" }
mlapp-runtime = { path = "../mlapp-runtime" }
mlapp-plot = { path = "../mlapp-plot" }
egui = { version = "0.37.0", optional = true }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"], optional = true }
png = "0.18.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }

[features]
default = ["egui-backend"]
egui-backend = ["dep:egui", "dep:eframe"]
