[package]
name = "rustlab-plot"
version = "0.1.0"
edition = "2021"
authors = ["RustLab contributors"]
license = "MIT OR Apache-2.0"
description = "Renderer-independent MATLAB-compatible plot model with deterministic SVG output"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
approx = "0.5"
