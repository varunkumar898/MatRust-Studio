# cargo-deny configuration for RustLab

[graph]
targets = [
    { triple = "aarch64-pc-windows-gnullvm" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "warn"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
version = 2
ignore = [
    "RUSTSEC-2024-0436", # paste is unmaintained (transitive dep of faer/gemm)
    "RUSTSEC-2026-0192", # ttf-parser is unmaintained (transitive dep of egui)
    "RUSTSEC-2026-0194", # quick-xml quadratic duplicate attribute checks
    "RUSTSEC-2026-0195", # quick-xml NsReader unbounded namespace allocation (not used; plain Reader used)
    "RUSTSEC-2026-0367", # zip extraction suid/sgid
    "RUSTSEC-2026-0368", # zip extraction symlinks
    "RUSTSEC-2026-0369", # zip permissions through symlinks
]
